<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Detail</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#0b1a0f 0%,#14301c 100%); color:#eef9f0; min-height:100vh; padding:24px; }
  .head { text-align:center; margin-bottom:20px; }
  .league { font-size:13px; color:#8cb89a; text-transform:uppercase; letter-spacing:1px; }
  .tvs { display:flex; align-items:center; justify-content:center; gap:18px; margin:10px 0 6px; }
  .tvs img { width:52px; height:52px; object-fit:contain; }
  .tvs .name { font-size:22px; font-weight:800; max-width:260px; }
  .tvs .vs { color:#22c55e; font-weight:800; }
  .when { font-size:14px; color:#c9e5d2; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:18px; }
  @media (max-width:700px){ .cols { grid-template-columns:1fr; } }
  .col { background:rgba(255,255,255,0.05); border:1px solid #23492f; border-radius:14px; padding:16px; }
  .col h2 { font-size:15px; font-weight:800; margin-bottom:4px; }
  .chips { margin-bottom:12px; }
  .chip { display:inline-flex; width:26px; height:26px; border-radius:6px; align-items:center; justify-content:center;
    font-weight:800; font-size:13px; margin-right:5px; }
  .W { background:#22c55e; color:#06230f; } .D { background:#eab308; color:#231d06; } .L { background:#ef4444; color:#2b0808; }
  .row { display:flex; justify-content:space-between; font-size:13px; padding:6px 2px; border-bottom:1px solid #1b3a25; color:#c9e5d2; }
  .row:last-child { border-bottom:none; }
  .row .sc { font-variant-numeric:tabular-nums; font-weight:700; }
  .empty { color:#5a8c6b; font-style:italic; font-size:13px; }
</style>
</head>
<body>
  <div class="head" id="head"></div>
  <div class="cols" id="cols"></div>
<script>
  function getData() {
    var raw = new URLSearchParams(window.location.search).get('data');
    if (!raw) return null;
    try { return JSON.parse(decodeURIComponent(escape(atob(raw.replace(/-/g,'+').replace(/_/g,'/'))))); }
    catch(e){ return null; }
  }
  function formCol(title, crest, form) {
    var chips = (form||[]).map(function(f){ return '<span class="chip '+f.result+'">'+f.result+'</span>'; }).join('');
    var rows = (form||[]).map(function(f){
      var dt = new Date(f.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
      return '<div class="row"><span>'+(f.home?'vs':'at')+' '+f.opponent+'</span><span class="sc">'+f.gf+':'+f.ga+' &middot; '+dt+'</span></div>';
    }).join('');
    if (!chips) { chips=''; rows='<div class="empty">No recent results available.</div>'; }
    return '<div class="col"><h2>'+title+'</h2><div style="font-size:11px;color:#8cb89a;margin-bottom:6px">Last 5 &middot; newest first</div>'+
      '<div class="chips">'+chips+'</div>'+rows+'</div>';
  }
  var d = getData();
  if (d && d.match) {
    var m = d.match;
    var dt = new Date(m.utcDate);
    var hc = m.home_crest ? '<img src="'+m.home_crest+'" onerror="this.style.display=\'none\'">' : '';
    var ac = m.away_crest ? '<img src="'+m.away_crest+'" onerror="this.style.display=\'none\'">' : '';
    document.getElementById('head').innerHTML =
      '<div class="league">'+(d.league_name||'')+' &middot; Matchday '+m.matchday+'</div>'+
      '<div class="tvs">'+hc+'<span class="name">'+m.home+'</span><span class="vs">vs</span><span class="name">'+m.away+'</span>'+ac+'</div>'+
      '<div class="when">'+dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+' &middot; '+
        dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'</div>';
    document.getElementById('cols').innerHTML = formCol(m.home, m.home_crest, d.home_form) + formCol(m.away, m.away_crest, d.away_form);
  } else {
    document.getElementById('head').innerHTML = '<div class="empty">No match data received.</div>';
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchday</title>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script defer src="https://cpee.org/out/frames/js/frames.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#0b1a0f 0%,#14301c 100%); color:#eef9f0; min-height:100vh; padding:18px 20px; }
  h1 { font-size:20px; font-weight:800; margin-bottom:2px; }
  .sub { font-size:12px; color:#8cb89a; margin-bottom:12px; }
  .m { display:grid; grid-template-columns:1fr 92px auto; gap:10px; align-items:center;
    background:rgba(255,255,255,0.05); border:1px solid #23492f; border-radius:12px; padding:8px 12px; margin-bottom:7px; }
  .teams { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; flex-wrap:wrap; }
  .teams img { width:20px; height:20px; object-fit:contain; }
  .sc { color:#22c55e; font-weight:800; font-size:15px; padding:0 4px; }
  .sc.vs { color:#8cb89a; font-weight:400; font-size:12px; }
  .when { font-size:12px; color:#8cb89a; text-align:right; line-height:1.3; }
  .when b { color:#c9e5d2; display:block; }
  .qr { background:#fff; padding:3px; border-radius:6px; line-height:0; width:66px; height:66px; }
  .qr .wait { display:block; width:60px; height:60px; background:#eee; border-radius:4px; }
  .empty { padding:40px; text-align:center; color:#5a8c6b; font-style:italic; }
  .hint { font-size:11px; color:#5a8c6b; margin-top:8px; }
</style>
</head>
<body>
  <h1 id="title">&#9917; Matchday</h1>
  <div class="sub" id="sub">Scan the code next to a match for team form &middot; right side: table, league, exit</div>
  <div id="list"><div class="empty">Loading&hellip;</div></div>
  <div class="hint">Finished games show the final score; remaining games show kickoff time.</div>
<script>
  function getData() {
    var raw = new URLSearchParams(window.location.search).get('data');
    if (!raw) return null;
    try { return JSON.parse(decodeURIComponent(escape(atob(raw.replace(/-/g,'+').replace(/_/g,'/'))))); }
    catch(e){ return null; }
  }
  var d = getData();
  if (d && d.matches && d.matches.length) {
    document.getElementById('title').innerHTML = '&#9917; ' + (d.league_name || 'Matchday') +
      (d.matchday ? ' &middot; Matchday ' + d.matchday : '');
    var html = '';
    d.matches.forEach(function(m,i){
      var dt = new Date(m.utcDate);
      var day = dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
      var time = dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      var hc = m.home_crest ? '<img src="'+m.home_crest+'" onerror="this.style.display=\'none\'">' : '';
      var ac = m.away_crest ? '<img src="'+m.away_crest+'" onerror="this.style.display=\'none\'">' : '';
      var done = m.score && m.score.home != null;
      var sc = done ? '<span class="sc">'+m.score.home+' - '+m.score.away+'</span>' : '<span class="sc vs">vs</span>';
      var when = done ? '<b>'+day+'</b>Full time' : '<b>'+day+'</b>'+time;
      html += '<div class="m">'+
        '<div class="teams">'+hc+m.home+' '+sc+' '+ac+m.away+'</div>'+
        '<div class="when">'+when+'</div>'+
        '<div class="qr" id="qr'+i+'"><span class="wait"></span></div></div>';
    });
    document.getElementById('list').innerHTML = html;
  } else {
    document.getElementById('list').innerHTML = '<div class="empty">No matches found.</div>';
  }

  // One QR per match, all pointing at this frame's callback with a different value (m0, m1, ...)
  var rendered = false;
  function renderQRs() {
    if (rendered || typeof cpee === 'undefined' || !cpee.callback || !d || !d.matches) return;
    rendered = true;
    d.matches.forEach(function(m,i){
      var box = document.getElementById('qr'+i); if (!box) return;
      box.innerHTML = '';
      var target = 'https://lehre.bpm.in.tum.de/~go49leg/fb_send.html?cb=' + encodeURIComponent(cpee.callback) + '&value=m' + i;
      new QRCode(box, { text: target, width: 60, height: 60, correctLevel: QRCode.CorrectLevel.L });
    });
  }
  document.addEventListener('cpee:message', renderQRs);
  window.addEventListener('cpee:message', renderQRs);
  var tries = 0, t = setInterval(function(){ renderQRs(); if (rendered || ++tries > 40) clearInterval(t); }, 250);
</script>
</body>
</html>
